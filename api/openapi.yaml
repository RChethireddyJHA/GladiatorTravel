openapi: 3.0.3
info:
  title: GladiatorTravel API
  version: 0.1.0
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Healthy
  /api/v1/destinations:
    get:
      summary: List ranked destinations
      parameters:
        - in: query
          name: sort
          schema:
            type: string
            enum: [food, bar, combined]
        - in: query
          name: min_score
          schema:
            type: number
      responses:
        "200":
          description: Destination list
  /api/v1/destinations/{id}/venues:
    get:
      summary: List venues for destination
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Venue list
  /api/v1/destinations/{id}/accommodations:
    get:
      summary: List accommodations for destination
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accommodation list
  /api/v1/destinations/{id}/travel-options:
    get:
      summary: List travel options
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Travel options
  /api/v1/me/preferences:
    put:
      summary: Upsert user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPreferencesRequest"
            example:
              user_id: 1
              budget_level: 3
              prefers_late_night: true
              avoid_tags: quiet_only
      responses:
        "200":
          description: Saved
  /api/v1/me/venues/{venueID}/feedback:
    post:
      summary: Add user feedback to a venue
      parameters:
        - in: path
          name: venueID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueFeedbackRequest"
            example:
              user_id: 1
              feedback: up
      responses:
        "201":
          description: Recorded
  /api/v1/trips:
    post:
      summary: Create trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
            example:
              user_id: 1
              destination_id: 1
              start_date: "2026-06-01"
              end_date: "2026-06-04"
      responses:
        "201":
          description: Trip created
  /api/v1/trips/{tripID}/generate-itinerary:
    post:
      summary: Generate itinerary
      parameters:
        - in: path
          name: tripID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateItineraryRequest"
            example:
              destination_id: 1
              days: 3
      responses:
        "201":
          description: Generated
  /api/v1/trips/{tripID}/itinerary:
    get:
      summary: Get itinerary
      parameters:
        - in: path
          name: tripID
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Itinerary items

components:
  schemas:
    UpsertPreferencesRequest:
      type: object
      required: [user_id, budget_level, prefers_late_night, avoid_tags]
      properties:
        user_id:
          type: integer
          format: int64
        budget_level:
          type: integer
          minimum: 1
          maximum: 4
        prefers_late_night:
          type: boolean
        avoid_tags:
          type: string
    VenueFeedbackRequest:
      type: object
      required: [user_id, feedback]
      properties:
        user_id:
          type: integer
          format: int64
        feedback:
          type: string
          enum: [up, down]
    CreateTripRequest:
      type: object
      required: [user_id, destination_id, start_date, end_date]
      properties:
        user_id:
          type: integer
          format: int64
        destination_id:
          type: integer
          format: int64
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    GenerateItineraryRequest:
      type: object
      required: [destination_id, days]
      properties:
        destination_id:
          type: integer
          format: int64
        days:
          type: integer
          minimum: 1
