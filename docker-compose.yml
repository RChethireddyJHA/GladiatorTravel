services:
  db:
    image: postgres:16
    container_name: gladiatortravel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gladiatortravel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gladiatortravel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  migrate:
    image: migrate/migrate:4
    container_name: gladiatortravel-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@db:5432/gladiatortravel?sslmode=disable",
        "up"
      ]
  seed:
    image: postgres:16
    container_name: gladiatortravel-seed
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/gladiatortravel?sslmode=disable
    volumes:
      - ./seed:/seed:ro
      - ./scripts/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gladiatortravel-api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/gladiatortravel?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  pgdata:
