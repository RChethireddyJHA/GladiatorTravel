services:
  db:
    image: postgres:16
    container_name: gladiatortravel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gladiatortravel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gladiatortravel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  migrate:
    image: migrate/migrate:4
    container_name: gladiatortravel-migrate
    profiles: ["init"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@db:5432/gladiatortravel?sslmode=disable",
        "up"
      ]
    restart: "no"
  seed:
    image: postgres:16
    container_name: gladiatortravel-seed
    profiles: ["init"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/gladiatortravel?sslmode=disable
    volumes:
      - ./seed:/seed:ro
      - ./scripts/seed.sh:/seed.sh:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "tr -d '\\r' < /seed.sh > /tmp/seed.sh && /bin/sh /tmp/seed.sh"
      ]
    restart: "no"
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gladiatortravel-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/gladiatortravel?sslmode=disable
    ports:
      - "8080:8080"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gladiatortravel-frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
